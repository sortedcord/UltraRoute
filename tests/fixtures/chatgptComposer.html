<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>ChatGPT native composer fixture</title>
  <body>
    <button id="temporary">Turn off temporary chat</button>
    <button aria-label="Select ChatGPT model" id="models">
      Thinking effortInstant
    </button>
    <div id="menu" hidden>
      <button role="menuitem" aria-label="Select model" id="mode">
        Instant
      </button>
      <button role="menuitemradio" aria-checked="true" id="sol">
        GPT-5.6 Sol
      </button>
      <button role="menuitemradio" aria-checked="false" id="previous">
        GPT-5.5<span>Leaving onOctober14</span>
      </button>
      <input
        role="slider"
        aria-valuemin="0"
        aria-valuemax="2"
        aria-valuenow="0"
        disabled
      />
    </div>
    <button id="instant">Instant</button><button id="think">Think</button>
    <input type="file" multiple />
    <div id="attachments"></div>
    <div contenteditable="true" role="textbox" aria-label="Message"></div>
    <button aria-label="Send" disabled>Send</button>
    <script>
      const query = new URL(location.href).searchParams;
      const composer = document.querySelector("[contenteditable]");
      const send = document.querySelector('[aria-label="Send"]');
      const menu = document.getElementById("menu");
      let model = "gpt-5-6";
      let think = false;
      let uploads = [];
      document.getElementById("models").onclick = () => {
        menu.hidden = !menu.hidden;
      };
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") menu.hidden = true;
      });
      const power = document.querySelector('[role="slider"]');
      power.addEventListener("keydown", (event) => {
        event.preventDefault();
        if (event.key === "Home") power.setAttribute("aria-valuenow", "0");
        else if (event.key === "End") power.setAttribute("aria-valuenow", "2");
        else if (event.key === "ArrowLeft")
          power.setAttribute(
            "aria-valuenow",
            String(
              Math.max(0, Number(power.getAttribute("aria-valuenow")) - 1),
            ),
          );
        else if (event.key === "ArrowRight")
          power.setAttribute(
            "aria-valuenow",
            String(
              Math.min(2, Number(power.getAttribute("aria-valuenow")) + 1),
            ),
          );
        const mode = ["Instant", "Medium", "High"][
          Number(power.getAttribute("aria-valuenow"))
        ];
        document.getElementById("mode").textContent = mode;
        document.getElementById("models").textContent =
          `Thinking effort${mode}`;
      });
      for (const id of ["sol", "previous"])
        document.getElementById(id).onclick = () => {
          model = id === "sol" ? "gpt-5-6" : "gpt-5-5";
          document
            .getElementById("sol")
            .setAttribute("aria-checked", String(id === "sol"));
          document
            .getElementById("previous")
            .setAttribute("aria-checked", String(id === "previous"));
        };
      document.getElementById("instant").onclick = () => {
        model = "auto";
        think = false;
      };
      document.getElementById("think").onclick = () => {
        model = "auto";
        think = true;
      };
      composer.addEventListener("input", () => {
        send.disabled = !composer.textContent.trim();
      });
      document
        .querySelector("input[type=file]")
        .addEventListener("change", async (event) => {
          send.disabled = true;
          document.getElementById("attachments").replaceChildren();
          const progress = document.createElement("div");
          progress.role = "progressbar";
          document.getElementById("attachments").append(progress);
          uploads = await Promise.all(
            Array.from(event.target.files, async (file) => ({
              name: file.name,
              mimeType: file.type,
              data: Array.from(new Uint8Array(await file.arrayBuffer())),
            })),
          );
          for (const file of uploads) {
            const label = document.createElement("span");
            label.textContent = file.name;
            document.getElementById("attachments").append(label);
          }
          progress.remove();
          send.disabled = !composer.textContent.trim();
        });
      if (query.get("temporary") === "off")
        document.getElementById("temporary").textContent =
          "Turn on temporary chat";
      document.getElementById("temporary").onclick = () => {
        document.getElementById("temporary").textContent =
          "Turn off temporary chat";
      };
      if (query.get("free") === "unavailable") {
        document.getElementById("instant").remove();
        document.getElementById("think").remove();
      }
      send.onclick = async () => {
        send.disabled = true;
        const payload = {
          model,
          think,
          prompt: composer.textContent,
          temporary:
            document.getElementById("temporary").textContent ===
            "Turn off temporary chat",
          attachments: uploads,
        };
        const prepare = await fetch("/backend-api/f/conversation/prepare", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!prepare.ok) return;
        const response = await fetch("/backend-api/f/conversation", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
        });
        await response.text();
      };
    </script>
  </body>
</html>
